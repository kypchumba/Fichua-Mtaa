spring.application.name=fichua-mtaa-api
# Import the ignored local backend/.env file when running from the backend directory.
# Render and other deployments continue to use injected environment variables.
spring.config.import=optional:file:./.env[.properties]
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/fichuamtaa}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${SESSION_SAME_SITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
spring.servlet.multipart.max-file-size=512KB
spring.servlet.multipart.max-request-size=600KB
